[build-system]
requires = ["setuptools>=66"]
build-backend = "setuptools.build_meta"

[project]
name = "chordflow"
version = "0.1.0"
description = "Suite de aplicaciones para acordes y canciones de guitarra."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "chardet",
    "PyQt6",
]

[project.gui-scripts]
chordflow = "chordflow.app:main"

[tool.setuptools.packages.find]
where = [".", "chordpages"]
include = ["chordflow*", "chordpages*"]

[tool.setuptools.package-data]
chordflow = ["dicts/**/*.aff", "dicts/**/*.dic", "dicts/**/*.dat", "dicts/**/*.idx"]
chordpages = ["assets/*.svg"]

[tool.setuptools.data-files]
"share/chordflow/translations" = ["chordpages/translations/*.qm"]
"share/chordflow/resources" = ["resources/dicts/**/*", "dictionaries.json"]
